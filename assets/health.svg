<svg xmlns="http://www.w3.org/2000/svg" width="1075" height="364" viewBox="0 0 1075 364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect width="1075" height="364" rx="9" fill="#12141a"/>
  <circle cx="20" cy="18" r="5" fill="#e0605a"/><circle cx="38" cy="18" r="5" fill="#e0b44a"/><circle cx="56" cy="18" r="5" fill="#5ab55a"/>
  <text xml:space="preserve"><tspan x="22.0" y="44.0" fill="#c8d0da" font-weight="600">DISK</tspan><tspan x="22.0" y="63.0" fill="#c8d0da">&#160;&#160;</tspan><tspan x="38.9" y="63.0" fill="#c8d0da" font-weight="600">███████████████████████████▎</tspan><tspan x="275.5" y="63.0" fill="#c8d0da">&#160;&#160;6.3&#160;GB&#160;free&#160;of&#160;228.3&#160;GB</tspan><tspan x="22.0" y="82.0" fill="#6b7684">&#160;&#160;221.9&#160;GB&#160;in&#160;use&#160;—&#160;144.7&#160;GB&#160;under&#160;the&#160;folder&#160;scanned,&#160;77.2&#160;GB&#160;elsewhere&#160;(system,&#160;applications,&#160;other&#160;users)</tspan><tspan x="22.0" y="120.0" fill="#c8d0da" font-weight="600">MEMORY</tspan><tspan x="22.0" y="139.0" fill="#c8d0da">&#160;&#160;memory&#160;pressure&#160;&#160;&#160;</tspan><tspan x="191.0" y="139.0" fill="#ff5f5f">RED</tspan><tspan x="216.3" y="139.0" fill="#c8d0da">&#160;&#160;struggling&#160;—&#160;swapping&#160;heavily,&#160;which&#160;is&#160;what&#160;slow&#160;feels&#160;like</tspan><tspan x="22.0" y="158.0" fill="#c8d0da">&#160;&#160;free&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;61%&#160;&#160;&#160;</tspan><tspan x="241.7" y="158.0" fill="#6b7684">(macOS&#160;keeps&#160;RAM&#160;full&#160;on&#160;purpose&#160;—&#160;this&#160;number&#160;is&#160;not&#160;the&#160;problem)</tspan><tspan x="22.0" y="177.0" fill="#c8d0da">&#160;&#160;swap&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan x="191.0" y="177.0" fill="#ff5f5f">3.2&#160;GB&#160;of&#160;4.0&#160;GB</tspan><tspan x="326.2" y="177.0" fill="#c8d0da">&#160;&#160;80%&#160;full</tspan><tspan x="22.0" y="196.0" fill="#c8d0da">&#160;&#160;compressor&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;holding&#160;4.2&#160;GB</tspan><tspan x="22.0" y="234.0" fill="#c8d0da" font-weight="600">PROTECTIONS</tspan><tspan x="22.0" y="253.0" fill="#c8d0da">&#160;&#160;</tspan><tspan x="38.9" y="253.0" fill="#00af5f">ok&#160;&#160;</tspan><tspan x="72.7" y="253.0" fill="#c8d0da">&#160;&#160;System&#160;Integrity&#160;Protection&#160;&#160;enabled</tspan><tspan x="22.0" y="272.0" fill="#c8d0da">&#160;&#160;</tspan><tspan x="38.9" y="272.0" fill="#00af5f">ok&#160;&#160;</tspan><tspan x="72.7" y="272.0" fill="#c8d0da">&#160;&#160;FileVault&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;on</tspan><tspan x="22.0" y="291.0" fill="#c8d0da">&#160;&#160;</tspan><tspan x="38.9" y="291.0" fill="#00af5f">ok&#160;&#160;</tspan><tspan x="72.7" y="291.0" fill="#c8d0da">&#160;&#160;Gatekeeper&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;enabled</tspan><tspan x="22.0" y="310.0" fill="#c8d0da">&#160;&#160;</tspan><tspan x="38.9" y="310.0" fill="#00af5f">ok&#160;&#160;</tspan><tspan x="72.7" y="310.0" fill="#c8d0da">&#160;&#160;XProtect&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;version&#160;5363</tspan><tspan x="22.0" y="329.0" fill="#6b7684">&#160;&#160;every&#160;protection&#160;macOS&#160;ships&#160;with&#160;is&#160;on.&#160;a&#160;third-party&#160;antivirus&#160;would&#160;mostly&#160;add&#160;a&#160;kernel&#160;extension&#160;and&#160;cost&#160;you&#160;speed.</tspan></text>
</svg>
